<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <style>
            /* Paleta de colores inspirada en la imagen de referencia */
            .bg-orange { fill: #E87A15; }
            .dark { fill: #0A1F3D; }
            .dark-stroke { fill: none; stroke: #0A1F3D; stroke-linecap: round; stroke-linejoin: round; }
            .cream { fill: #F4EFE6; }
            .cream-stroke { fill: none; stroke: #F4EFE6; stroke-linecap: round; }
            .green { fill: #008F7A; }
        </style>
    </defs>

    <!-- Fondo: Eliminamos el 'rx' para que cubra todo el lienzo y Android haga el recorte circular limpio -->
    <rect width="512" height="512" fill="rgba(0, 143, 122, 0.25)"/>

    <!-- ============================================== -->
    <!-- ZONA SEGURA (Safe Zone Maskable Icon)          -->
    <!-- Centra y escala el contenido al 56%            -->
    <!-- ============================================== -->
    <g transform="translate(112.6, 112.6) scale(0.56)">

        <!-- 1. PIN DE UBICACIÓN (Arriba Izquierda) -->
        <g transform="translate(36, 36)">
            <rect width="204" height="204" rx="32" class="bg-orange" />
            <path d="M 102 35 A 55 55 0 0 0 47 90 C 47 135 102 175 102 175 C 102 175 157 135 157 90 A 55 55 0 0 0 102 35 Z"
                  class="cream" stroke="#0A1F3D" stroke-width="16" stroke-linejoin="round"/>
            <circle cx="102" cy="90" r="22" class="dark" />
        </g>

        <!-- 2. TREN LIGERO (Arriba Derecha) -->
        <g transform="translate(272, 36)">
            <rect width="204" height="204" rx="32" class="bg-orange" />
            <rect x="35" y="30" width="134" height="125" rx="32" class="dark" />
            <rect x="52" y="50" width="100" height="60" rx="14" class="cream" />
            <rect x="52" y="120" width="100" height="12" rx="6" class="green" />
            <circle cx="65" cy="140" r="6" class="cream" />
            <circle cx="139" cy="140" r="6" class="cream" />
            <path d="M 65 170 L 139 170 M 55 185 L 149 185 M 82 160 L 82 185 M 122 160 L 122 185"
                  class="dark-stroke" stroke-width="10"/>
        </g>

        <!-- 3. AUTOBÚS / BRT (Abajo Izquierda) -->
        <g transform="translate(36, 272)">
            <rect width="204" height="204" rx="32" class="bg-orange" />
            <rect x="15" y="45" width="70" height="95" rx="8" class="dark" />
            <rect x="25" y="55" width="50" height="50" rx="6" class="cream" />
            <path d="M 105 45 L 160 45 C 180 45 190 60 190 90 L 190 140 L 105 140 Z" class="dark" />
            <rect x="115" y="55" width="35" height="50" rx="6" class="cream" />
            <path d="M 160 55 L 170 55 C 175 55 178 65 178 80 L 178 105 L 160 105 Z" class="cream" />
            <line x1="90" y1="55" x2="90" y2="135" class="dark-stroke" stroke-width="6"/>
            <line x1="100" y1="55" x2="100" y2="135" class="dark-stroke" stroke-width="6"/>
            <circle cx="50" cy="145" r="16" class="dark" />
            <circle cx="50" cy="145" r="6" class="cream" />
            <circle cx="150" cy="145" r="16" class="dark" />
            <circle cx="150" cy="145" r="6" class="cream" />
            <line x1="10" y1="170" x2="194" y2="170" class="dark-stroke" stroke-width="12"/>
        </g>

        <!-- 4. BICICLETA (Abajo Derecha) -->
        <g transform="translate(272, 272)">
            <rect width="204" height="204" rx="32" class="bg-orange" />
            <circle cx="55" cy="135" r="28" class="cream" stroke="#0A1F3D" stroke-width="12" />
            <circle cx="149" cy="135" r="28" class="cream" stroke="#0A1F3D" stroke-width="12" />
            <path d="M 55 135 L 85 135 L 75 75 Z" class="dark-stroke" stroke-width="10" />
            <path d="M 85 135 L 130 70 L 75 75" class="dark-stroke" stroke-width="10" />
            <line x1="130" y1="70" x2="149" y2="135" class="dark-stroke" stroke-width="10"/>
            <line x1="75" y1="75" x2="72" y2="55" class="dark-stroke" stroke-width="10"/>
            <path d="M 60 55 L 85 55" class="dark-stroke" stroke-width="12"/>
            <line x1="130" y1="70" x2="125" y2="50" class="dark-stroke" stroke-width="10"/>
            <path d="M 115 50 L 140 50 C 150 50 150 70 140 70" class="dark-stroke" stroke-width="10"/>
        </g>

    </g>
</svg>
